[project]
name = "travel-planner-backend"
version = "0.1.0"
description = "智能旅行规划助手后端服务"
requires-python = ">=3.11"
dependencies = [
    "crewai>=0.80.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "tavily-python>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.3.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]
